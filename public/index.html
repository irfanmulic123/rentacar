<!DOCTYPE html>
<html lang="sr-Latn-ME">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primorje Rent a Car</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#">Primorje<span>Rent a Car</span></a>
  <nav><a href="#flota">Vozila</a><a href="#rezervacije">Moje rezervacije</a></nav>
</header>

<section class="hero">
  <h1>Auto na obali,<br>spremno za sat vremena.</h1>
  <form id="search" class="bar">
    <label>Preuzimanje
      <select id="loc"><option>Podgorica aerodrom</option><option>Budva</option><option>Kotor</option><option>Bar</option><option>Tivat aerodrom</option></select>
    </label>
    <label>Od <input type="date" id="from" required></label>
    <label>Do <input type="date" id="to" required></label>
    <button class="btn">Prikaži slobodna vozila</button>
  </form>
  <p id="range-msg" class="note" role="status"></p>
</section>

<main>
  <section id="flota">
    <div class="filters">
      <label>Kategorija <select id="f-cat"><option value="">Sve</option><option>Ekonomik</option><option>Kompakt</option><option>SUV</option><option>Premium</option></select></label>
      <label>Mjenjač <select id="f-tr"><option value="">Svi</option><option>Manuelni</option><option>Automatik</option></select></label>
      <label>Max cijena/dan <input type="range" id="f-price" min="20" max="150" step="5" value="150"><output id="f-out">150 €</output></label>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <section id="rezervacije">
    <h2>Moje rezervacije</h2>
    <div id="bookings"></div>
  </section>
</main>

<dialog id="dlg">
  <form id="book" method="dialog">
    <h3 id="d-title"></h3>
    <p id="d-sum" class="note"></p>
    <label>Ime i prezime <input name="name" required autocomplete="name"></label>
    <label>Email <input name="email" type="email" required autocomplete="email"></label>
    <label>Telefon <input name="phone" type="tel" required autocomplete="tel"></label>
    <p id="d-err" class="err" role="alert"></p>
    <div class="row"><button type="button" class="btn ghost" id="d-cancel">Odustani</button><button class="btn">Potvrdi rezervaciju</button></div>
  </form>
</dialog>

<footer>© Primorje Rent a Car. <a href="admin.html">Admin</a></footer>
<script src="app.js"></script>
</body>
</html>
